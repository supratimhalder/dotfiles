<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>Iosevka Nerd Font Mono</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Iosevka Aile</family>
      <family>Iosevka Nerd Font Propo</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer>
      <family>Iosevka Etoile</family>
      <family>Iosevka Nerd Font Propo</family>
    </prefer>
  </alias>
</fontconfig>
